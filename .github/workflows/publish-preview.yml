name: Publish PitMedic unsigned preview

on:
  push:
    branches: [main]
    paths:
      - "Source/**"
      - "Build/**"
      - "Installer/**"
      - "Build and Run PitMedic.cmd"
      - ".github/workflows/publish-preview.yml"

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw Source/PitMedic/PitMedic.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read the PitMedic version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Refuse to replace an existing release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release ${{ steps.version.outputs.tag }} already exists. Bump the PitMedic version instead of replacing a downloadable build."
          }
          exit 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build unsigned Windows release
        shell: pwsh
        run: ./Build/Build-UnsignedRelease.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build unsigned installer
        shell: pwsh
        run: ./Build/Build-Installer.ps1 -PayloadPath ./Artifacts/unsigned

      - name: Assemble clearly labeled preview files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $preview = New-Item -ItemType Directory -Force -Path ./Artifacts/preview
          Copy-Item ./Artifacts/installer/PitMedic-Setup-x64.exe "$($preview.FullName)/PitMedic-Setup-x64-UNSIGNED-PREVIEW.exe"

          $payload = Get-ChildItem ./Artifacts/unsigned -Directory -Filter "PitMedic-$version-win-x64" | Select-Object -First 1
          if (-not $payload) { throw "The portable release payload was not found." }
          Compress-Archive -Path "$($payload.FullName)/*" -DestinationPath "$($preview.FullName)/PitMedic-$version-win-x64-UNSIGNED-PREVIEW.zip" -CompressionLevel Optimal

          $publicFiles = Get-ChildItem $preview.FullName -File
          $checksums = foreach ($file in $publicFiles) {
            "$((Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant())  $($file.Name)"
          }
          $checksums | Set-Content -Encoding ASCII "$($preview.FullName)/SHA256SUMS-UNSIGNED-PREVIEW.txt"

          @"
          This is the public PitMedic $version test preview.

          It is intentionally unsigned while the PitMedic SignPath application is pending. Windows may show an Unknown publisher or SmartScreen warning. The package must not be described as an official signed release.

          v0.6.0.2 refreshes the Home experience with useful Windows system tools, removes the old Simulator Readiness card, and introduces PitMedic's contained update flow: future updates can download inside the app, verify the published SHA-256 fingerprint, hand off to the installer, and relaunch PitMedic automatically after installation.

          The v0.6 line also includes simulator-specific monitored time and clean streaks; verified live mileage for iRacing, Assetto Corsa Competizione, RaceRoom, and Automobilista 2; persistent distance cards; Metric/Imperial display controls; lightweight background monitoring; privacy-safe anonymous usage counting; 48-hour recent-finding views; safer elevated repair validation; and improved upgrade behavior.

          PitMedic remains free and open source. Voluntary support unlocks nothing.
          "@ | Set-Content -Encoding UTF8 ./Artifacts/preview/RELEASE-NOTES-UNSIGNED-PREVIEW.txt

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem ./Artifacts/preview -File).FullName
          gh release create "${{ steps.version.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "PitMedic ${{ steps.version.outputs.version }} unsigned preview" `
            --notes-file ./Artifacts/preview/RELEASE-NOTES-UNSIGNED-PREVIEW.txt `
            --prerelease `
            $files

      - name: Publish verified update manifest and website version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $installer = Resolve-Path ./Artifacts/preview/PitMedic-Setup-x64-UNSIGNED-PREVIEW.exe
          $sha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/PitMedic-Setup-x64-UNSIGNED-PREVIEW.exe"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"

          $manifest = [ordered]@{
            schemaVersion = 1
            latestVersion = $version
            title = "PitMedic $version unsigned test preview"
            downloadUrl = $downloadUrl
            releaseUrl = $releaseUrl
            sha256 = $sha256
          } | ConvertTo-Json
          $manifest | Set-Content -Encoding UTF8 website/update.json

          Get-ChildItem website -Recurse -Filter *.html | ForEach-Object {
            $html = Get-Content -Raw $_.FullName
            $html = [regex]::Replace($html, 'https://github\.com/rholmes426/PitMedic/releases/download/v[0-9.]+/PitMedic-Setup-x64-UNSIGNED-PREVIEW\.exe', $downloadUrl)
            $html = [regex]::Replace($html, '"softwareVersion":"[0-9.]+"', '"softwareVersion":"' + $version + '"')
            $html = [regex]::Replace($html, 'Current test preview <strong>[0-9.]+</strong>', 'Current test preview <strong>' + $version + '</strong>')
            $html | Set-Content -Encoding UTF8 $_.FullName
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/update.json website/*.html website/simulators/*/index.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish PitMedic $version website metadata"
            git push origin HEAD:main
          }

      - name: Retain preview as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitMedic-${{ steps.version.outputs.version }}-unsigned-preview
          path: Artifacts/preview/
          if-no-files-found: error
          retention-days: 30
