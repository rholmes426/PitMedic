name: Publish PitMedic unsigned preview

on:
  push:
    branches: [main]
    paths:
      - "Source/**"
      - "Build/**"
      - "Installer/**"
      - "Build and Run PitMedic.cmd"
      - ".github/workflows/publish-preview.yml"

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw Source/PitMedic/PitMedic.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read the PitMedic version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Refuse to replace an existing release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release ${{ steps.version.outputs.tag }} already exists. Bump the PitMedic version instead of replacing a downloadable build."
          }
          exit 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run release policy tests
        run: dotnet run --project Source/PitMedic.ReleaseTests/PitMedic.ReleaseTests.csproj --configuration Release

      - name: Build unsigned Windows release
        shell: pwsh
        run: ./Build/Build-UnsignedRelease.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build unsigned installer
        shell: pwsh
        run: ./Build/Build-Installer.ps1 -PayloadPath ./Artifacts/unsigned

      - name: Assemble clearly labeled preview files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $preview = New-Item -ItemType Directory -Force -Path ./Artifacts/preview
          Copy-Item ./Artifacts/installer/PitMedic-Setup-x64.exe "$($preview.FullName)/PitMedic-Setup-x64-UNSIGNED-PREVIEW.exe"

          $payload = Get-ChildItem ./Artifacts/unsigned -Directory -Filter "PitMedic-$version-win-x64" | Select-Object -First 1
          if (-not $payload) { throw "The portable release payload was not found." }
          Compress-Archive -Path "$($payload.FullName)/*" -DestinationPath "$($preview.FullName)/PitMedic-$version-win-x64-UNSIGNED-PREVIEW.zip" -CompressionLevel Optimal

          $publicFiles = Get-ChildItem $preview.FullName -File
          $checksums = foreach ($file in $publicFiles) {
            "$((Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant())  $($file.Name)"
          }
          $checksums | Set-Content -Encoding ASCII "$($preview.FullName)/SHA256SUMS-UNSIGNED-PREVIEW.txt"

          @"
          This is the public PitMedic $version test preview.

          It is intentionally unsigned while the PitMedic SignPath application is pending. Windows may show an Unknown publisher or SmartScreen warning. The package must not be described as an official signed release.

          v0.6.0.9 adds detected-only reliability monitoring for installed wheelbase and companion software, with confirmed-fault evidence and approval-gated restart recovery after every supported simulator is closed. It makes AMS2 distance tracking diagnosable and resilient to a stalled odometer, preserves narrow iRacing repairs through elevated validation, moves Check for updates to the top of Settings, and corrects same-day anonymous usage-version refreshes without double-counting installations.

          The v0.6.0.9 source also includes a verified September 2026 simulator-forum review as the next diagnostic and repair backlog. Risky advice such as disabling security, broad administrator changes, third-party DLL downloads, and destructive profile deletion remains excluded from automatic repair.

          v0.6.0.8 improved the anonymous usage version reporting path; v0.6.0.9 corrects the remaining same-day throttle edge case that could leave the private dashboard on an older version.

          v0.6.0.7 captures exact simulator-reported session-best laps and exact track, layout, and car identity for all six supported simulators. It uses LMU's local player profile to avoid attributing another multiplayer driver's lap to the user, resolves RaceRoom car model IDs through the official catalog, and stops benign ACC TextRender and NVIDIA DriverStore shutdown diagnostics from offering unnecessary game-file repairs.

          v0.6.0.6 keeps recent findings and their evidence together, separates driving statistics from the 48-hour findings window, labels lifetime totals and session-best laps precisely, improves exact-combination iRacing reference matching, and links directly to the source video when a web lap supplies the comparison.

          v0.6.0.5 checks for updates whenever PitMedic launches while preserving approval for every download and install. It makes guided repair actions easier to reach, removes the redundant no-findings card when resolved evidence is present, places monitored distance and time beneath recent findings, removes Clean Streak from the visible activity panel, and adds exact-combination iRacing best laps with trustworthy benchmark-source comparison.

          v0.6.0.4 keeps the updater's Cancel and Install now actions visible on smaller displays and at increased Windows display scaling. Install now explicitly requests administrator approval before PitMedic closes and records the verified installer handoff in the local diagnostic log.

          v0.6.0.3 streamlined System Tools, corrected idle monitoring labels, improved CPU sensor-service recovery, and kept anonymous usage version labels current without double-counting installations.

          The v0.6 line also includes simulator-specific monitored time and verified live mileage for iRacing, Assetto Corsa Competizione, RaceRoom, and Automobilista 2; persistent distance cards; Metric/Imperial display controls; lightweight background monitoring; privacy-safe anonymous usage counting; 48-hour recent-finding views; safer elevated repair validation; and improved upgrade behavior.

          PitMedic remains free and open source. Voluntary support unlocks nothing.
          "@ | Set-Content -Encoding UTF8 ./Artifacts/preview/RELEASE-NOTES-UNSIGNED-PREVIEW.txt

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem ./Artifacts/preview -File).FullName
          gh release create "${{ steps.version.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "PitMedic ${{ steps.version.outputs.version }} unsigned preview" `
            --notes-file ./Artifacts/preview/RELEASE-NOTES-UNSIGNED-PREVIEW.txt `
            --prerelease `
            $files

      - name: Publish verified update manifest and website version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $installer = Resolve-Path ./Artifacts/preview/PitMedic-Setup-x64-UNSIGNED-PREVIEW.exe
          $sha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/PitMedic-Setup-x64-UNSIGNED-PREVIEW.exe"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"

          $manifest = [ordered]@{
            schemaVersion = 1
            latestVersion = $version
            title = "PitMedic $version unsigned test preview"
            downloadUrl = $downloadUrl
            releaseUrl = $releaseUrl
            sha256 = $sha256
          } | ConvertTo-Json
          $manifest | Set-Content -Encoding UTF8 website/update.json

          Get-ChildItem website -Recurse -Filter *.html | ForEach-Object {
            $html = Get-Content -Raw $_.FullName
            $html = [regex]::Replace($html, 'https://github\.com/rholmes426/PitMedic/releases/download/v[0-9.]+/PitMedic-Setup-x64-UNSIGNED-PREVIEW\.exe', $downloadUrl)
            $html = [regex]::Replace($html, '"softwareVersion":"[0-9.]+"', '"softwareVersion":"' + $version + '"')
            $html = [regex]::Replace($html, 'Current test preview <strong>[0-9.]+</strong>', 'Current test preview <strong>' + $version + '</strong>')
            $html | Set-Content -Encoding UTF8 $_.FullName
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/update.json website/*.html website/simulators/*/index.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish PitMedic $version website metadata"
            git push origin HEAD:main
          }

      - name: Retain preview as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitMedic-${{ steps.version.outputs.version }}-unsigned-preview
          path: Artifacts/preview/
          if-no-files-found: error
          retention-days: 30
