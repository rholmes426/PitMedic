name: Sign release with Azure Artifact Signing

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing protected tag to build, sign, verify, and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-sign-verify:
    if: ${{ startsWith(inputs.release_tag, 'v') }}
    runs-on: windows-2025
    environment: production-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out requested release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact tagged commit
        shell: pwsh
        run: |
          $tagCommit = git rev-list -n 1 "${{ inputs.release_tag }}"
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw "Checked-out commit does not match the requested tag." }

          [xml]$appProject = Get-Content -Raw Source/PitMedic/PitMedic.csproj
          [xml]$helperProject = Get-Content -Raw Source/PitMedic.RepairHelper/PitMedic.RepairHelper.csproj
          [xml]$sensorHelperProject = Get-Content -Raw Source/PitMedic.SensorHelper/PitMedic.SensorHelper.csproj
          $version = [string]($appProject.Project.PropertyGroup.Version | Select-Object -First 1)
          $helperVersion = [string]($helperProject.Project.PropertyGroup.Version | Select-Object -First 1)
          $sensorHelperVersion = [string]($sensorHelperProject.Project.PropertyGroup.Version | Select-Object -First 1)
          if ("${{ inputs.release_tag }}" -ne "v$version") { throw "Release tag does not match project version $version." }
          if ($helperVersion -ne $version) { throw "Repair helper version $helperVersion does not match app version $version." }
          if ($sensorHelperVersion -ne $version) { throw "Sensor helper version $sensorHelperVersion does not match app version $version." }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build unsigned app and helpers
        shell: pwsh
        run: ./Build/Build-UnsignedRelease.ps1 -ReleaseChannel stable

      - name: Locate release payload
        id: payload
        shell: pwsh
        run: |
          $payload = Get-ChildItem ./Artifacts/unsigned -Directory -Filter "PitMedic-*-win-x64" | Select-Object -First 1
          if (-not $payload) { throw "The unsigned PitMedic release payload was not found." }
          "path=$($payload.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: 880a903b-9c28-4f2f-8058-c3df84ea99ab
          tenant-id: 9b435f7a-5e9b-4da1-82a2-50e2f556871b
          subscription-id: c98cd262-4c9a-453a-96da-25de90651a7a

      - name: Sign PitMedic app and helpers
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: pitmedicsigning426
          certificate-profile-name: PITMEDICPUBLIC
          files: |
            ${{ steps.payload.outputs.path }}\PitMedic.exe
            ${{ steps.payload.outputs.path }}\PitMedic.RepairHelper.exe
            ${{ steps.payload.outputs.path }}\PitMedic.SensorHelper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: PitMedic Sim Racing Diagnostics and Repair
          description-url: https://pitmedic.com/

      - name: Verify app and helper signatures
        shell: pwsh
        run: |
          $expectedVersion = "${{ inputs.release_tag }}".TrimStart("v")
          ./Build/Verify-SignedRelease.ps1 -Path ./Artifacts/unsigned -ArtifactKind Binaries -ExpectedPublisher "Robert Holmes" -ExpectedVersion $expectedVersion

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer from signed binaries
        shell: pwsh
        run: ./Build/Build-Installer.ps1 -PayloadPath ./Artifacts/unsigned -OutputRoot ./Artifacts/installer

      - name: Sign PitMedic installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: pitmedicsigning426
          certificate-profile-name: PITMEDICPUBLIC
          files: ${{ github.workspace }}\Artifacts\installer\PitMedic-Setup-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: PitMedic Installer
          description-url: https://pitmedic.com/

      - name: Verify installer signature
        shell: pwsh
        run: |
          $expectedVersion = "${{ inputs.release_tag }}".TrimStart("v")
          ./Build/Verify-SignedRelease.ps1 -Path ./Artifacts/installer -ArtifactKind Installer -ExpectedPublisher "Robert Holmes"

          $installer = Get-Item ./Artifacts/installer/PitMedic-Setup-x64.exe
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer.FullName)
          $fileVersion = ([string]$versionInfo.FileVersion).Trim()
          $productVersion = ([string]$versionInfo.ProductVersion).Trim()
          if ($fileVersion -ne $expectedVersion -or $productVersion -notlike "$expectedVersion*") {
            throw "PitMedic installer version mismatch. Expected $expectedVersion; FileVersion '$fileVersion'; ProductVersion '$productVersion'."
          }

      - name: Assemble verified release package
        shell: pwsh
        run: ./Build/Assemble-SignedRelease.ps1 -SignedBinariesPath ./Artifacts/unsigned -SignedInstallerPath ./Artifacts/installer

      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: PitMedic-${{ inputs.release_tag }}-signed-release
          path: Artifacts/release/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: ${{ startsWith(inputs.release_tag, 'v') }}
    needs: build-sign-verify
    runs-on: windows-2025
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Download verified signed release
        uses: actions/download-artifact@v8
        with:
          name: PitMedic-${{ inputs.release_tag }}-signed-release
          path: Artifacts/release

      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Promote without overwriting signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Force source/Artifacts | Out-Null
          Move-Item Artifacts/release source/Artifacts/release
          python source/Build/release.py promote --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Signed asset promotion failed." }
      - name: Check out main for publication PR
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Generate signed website metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python site/Build/release.py prepare --tag $env:RELEASE_TAG --installer source/Artifacts/release/PitMedic-Setup-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Website generation failed." }
      - name: Open protected publication PR and start its checks
        shell: pwsh
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $branch = "release-metadata/$env:RELEASE_TAG"
          git ls-remote --exit-code --heads origin "refs/heads/$branch" | Out-Null
          $branchStatus = $LASTEXITCODE
          if ($branchStatus -notin 0, 2) { throw "Could not inspect publication branch." }
          $existingBranch = $branchStatus -eq 0
          if ($existingBranch) {
            git fetch origin "refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch publication branch." }
          }
          if ($existingBranch) {
            # Compare regenerated publication files before reusing an earlier branch.
            git add website Tools/DiagnosticLibrary/generate.py
            git diff --cached FETCH_HEAD --exit-code -- website Tools/DiagnosticLibrary/generate.py
            if ($LASTEXITCODE -ne 0) { throw "Existing publication branch differs; human review required." }
          }
          git switch -c $branch
          git add website Tools/DiagnosticLibrary/generate.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0 -and -not $existingBranch) {
            "Website metadata already matches the signed release." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (-not $existingBranch) {
            git commit -m "Publish signed $env:RELEASE_TAG website metadata"
            git push origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Publication branch push failed." }
          }
          $url = gh pr list --repo $env:GITHUB_REPOSITORY --head $branch --base main --state open --json url --jq '.[0].url'
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect publication PRs." }
          if (-not $url) {
            $url = gh pr create --repo $env:GITHUB_REPOSITORY --head $branch --base main --title "Publish signed $env:RELEASE_TAG website metadata" --body "Generated from verified signed assets. Merge only after Build Validation passes."
            if ($LASTEXITCODE -ne 0) { throw "Actions pull-request creation is blocked; check repository settings before resuming." }
          }
          gh workflow run ci.yml --repo $env:GITHUB_REPOSITORY --ref $branch
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch required checks." }
          "Publication PR: $url" >> $env:GITHUB_STEP_SUMMARY
