name: Bootstrap PitMedic 0.6.0.13 release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    if: ${{ github.event.head_commit.message == 'Release PitMedic 0.6.0.13' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Source/PitMedic/PitMedic.csproj)
          test "$version" = "0.6.0.13"
          test "$(grep -oPm1 '(?<=<Version>)[^<]+' Source/PitMedic.RepairHelper/PitMedic.RepairHelper.csproj)" = "$version"
          test "$(grep -oPm1 '(?<=<Version>)[^<]+' Source/PitMedic.SensorHelper/PitMedic.SensorHelper.csproj)" = "$version"

      - name: Create protected release tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.6.0.13"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')
            test "$remote_sha" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "PitMedic 0.6.0.13" --notes "Signed release preparation in progress."
          fi

      - name: Start hardened signing workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sign-release.yml --repo "$GITHUB_REPOSITORY" -f release_tag=v0.6.0.13
