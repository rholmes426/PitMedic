name: Build validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TelemetryWorker
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TelemetryWorker/package-lock.json
      - name: Install exact Worker dependencies
        run: npm ci
      - name: Type-check and test privacy boundaries
        run: npm run check
      - name: Validate the production Worker bundle
        run: npm run deploy:dry-run

  telemetry-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TelemetryDashboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TelemetryDashboard/package-lock.json
      - name: Install exact dashboard dependencies
        run: npm ci
      - name: Type-check and test read-only privacy boundaries
        run: npm run check
      - name: Validate the private dashboard Worker bundle
        run: npm run deploy:dry-run

  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore Source/PitMedic.RepairHelper/PitMedic.RepairHelper.csproj
          dotnet restore Source/PitMedic.SensorHelper/PitMedic.SensorHelper.csproj
      - name: Compile PitMedic Release
        run: dotnet build Source/PitMedic/PitMedic.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Compile elevated repair helper Release
        run: dotnet build Source/PitMedic.RepairHelper/PitMedic.RepairHelper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Compile read-only sensor service Release
        run: dotnet build Source/PitMedic.SensorHelper/PitMedic.SensorHelper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Build unsigned release input
        shell: pwsh
        run: ./Build/Build-UnsignedRelease.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build unsigned installer for packaging validation
        shell: pwsh
        run: ./Build/Build-Installer.ps1 -PayloadPath ./Artifacts/unsigned
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitMedic-unsigned-validation-${{ github.sha }}
          path: |
            Artifacts/unsigned/
            Artifacts/installer/
          if-no-files-found: error
          retention-days: 14
