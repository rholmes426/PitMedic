name: Build validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
      knowledge: ${{ steps.scope.outputs.knowledge }}
      worker: ${{ steps.scope.outputs.worker }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python Build/ci-scope.py
      - name: Release automation regression tests
        run: python -m unittest discover -s Build/tests -v
  repair-knowledge:
    needs: changes
    if: needs.changes.outputs.knowledge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate lifecycle coverage and safety policy
        run: python Tools/KnowledgeScout/knowledge_scout.py --validate-only
      - name: Verify Diagnostic Library matches app knowledge
        run: python Tools/DiagnosticLibrary/generate.py --check
      - name: Test Knowledge Scout behavior
        run: python -m unittest discover -s Tools/KnowledgeScout/tests -v

  telemetry-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TelemetryWorker
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TelemetryWorker/package-lock.json
      - name: Install exact Worker dependencies
        run: npm ci
      - name: Type-check and test privacy boundaries
        run: npm run check
      - name: Validate the production Worker bundle
        run: npm run deploy:dry-run

  telemetry-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TelemetryDashboard
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TelemetryDashboard/package-lock.json
      - name: Install exact dashboard dependencies
        run: npm ci
      - name: Type-check and test read-only privacy boundaries
        run: npm run check
      - name: Validate the private dashboard Worker bundle
        run: npm run deploy:dry-run

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore Source/PitMedic.RepairHelper/PitMedic.RepairHelper.csproj
          dotnet restore Source/PitMedic.SensorHelper/PitMedic.SensorHelper.csproj
          dotnet restore Source/PitMedic.ReleaseTests/PitMedic.ReleaseTests.csproj
      - name: Run release policy tests
        run: dotnet run --project Source/PitMedic.ReleaseTests/PitMedic.ReleaseTests.csproj --configuration Release --no-restore
      - name: Compile PitMedic Release
        run: dotnet build Source/PitMedic/PitMedic.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Compile elevated repair helper Release
        run: dotnet build Source/PitMedic.RepairHelper/PitMedic.RepairHelper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Compile read-only sensor service Release
        run: dotnet build Source/PitMedic.SensorHelper/PitMedic.SensorHelper.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Build unsigned release input
        shell: pwsh
        run: ./Build/Build-UnsignedRelease.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build unsigned installer for packaging validation
        shell: pwsh
        run: ./Build/Build-Installer.ps1 -PayloadPath ./Artifacts/unsigned
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitMedic-unsigned-validation-${{ github.sha }}
          path: |
            Artifacts/unsigned/
            Artifacts/installer/
          if-no-files-found: error
          retention-days: 14

  build-validation:
    name: Build Validation
    if: ${{ always() }}
    needs: [changes, repair-knowledge, telemetry-worker, telemetry-dashboard, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        shell: bash
        run: |
          test "${{ needs.changes.result }}" = "success"
          check() {
            if [ "$1" = "true" ]; then test "$2" = "success"; else test "$2" = "skipped"; fi
          }
          check "${{ needs.changes.outputs.knowledge }}" "${{ needs.repair-knowledge.result }}"
          check "${{ needs.changes.outputs.worker }}" "${{ needs.telemetry-worker.result }}"
          check "${{ needs.changes.outputs.dashboard }}" "${{ needs.telemetry-dashboard.result }}"
          check "${{ needs.changes.outputs.build }}" "${{ needs.build.result }}"
